<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="themes/theme-a.css">
    <link rel="stylesheet" href="themes/theme-b.css">
    <link rel="stylesheet" href="themes/theme-c.css">
    <link rel="stylesheet" href="themes/theme-d.css">
    <link rel="stylesheet" href="themes/theme-e.css">
    <link rel="stylesheet" href="themes/theme-f.css">
    <link rel="stylesheet" href="themes/theme-g.css">
    <link rel="stylesheet" href="themes/theme-h.css">
    <base target="_blank">
</head>

<body>

    <div id="dropzone">
        Drag photos here or click to select
        <input id="fileInput" type="file" multiple accept="image/*">
    </div>

    <div id="stage"></div>

    <div id="topbar">
        <button id="settingsBtn" title="Settings (Ctrl+K or /)">
            <img src="./setting-icon.png" class="setting-icon">
        </button>
    </div>

    <div id="dimOverlay"></div>

    <div id="commandBar" class="hidden">
        <input id="commandInput" type="text" placeholder="Type a command... (theme, mode, export)">
        <ul id="commandList"></ul>
        <div id="commandFooter">
            Interval: <input id="timeInput" type="number" min="1" value="2"> sec
        </div>
    </div>

    <!-- legacy controls: kept in the DOM (hidden) so the existing JS keeps working -->
    <div id="controls" style="display:none">
        <select id="modeSelect">
            <option value="manual">Manual</option>
            <option value="auto">Autoplay</option>
            <option value="random">Random</option>
        </select>

        <select id="themeSelect">
            <option value="a">A - Swap</option>
            <option value="b">B - Slide</option>
            <option value="c">C - Push</option>
            <option value="d">D - Stack</option>
            <option value="e">E - Split</option>
            <option value="f">F - Cube</option>
            <option value="g">G - Switch</option>
            <option value="h">H - Custom</option>
        </select>

        <button id="fullscreenBtn">Fullscreen</button>
        <button id="exportBtn">Export</button>
        <input id="importInput" type="file" accept="application/json">
        <button id="resetBtn">Reset</button>
    </div>

    <ul id="photoList"></ul>

    <script src="script.js"></script>
</body>

</html>
